<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grammar Quest: Adventure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #23243e, #1d1d2f 75%);
      color: #fff;
      margin: 0; padding: 0;
    }
    .main-container {
      max-width: 1100px;
      margin: 2rem auto;
      background: rgba(255,255,255,0.07);
      border-radius: 18px;
      box-shadow: 0 0 26px rgba(0,0,0,0.18);
      padding: 0;
      overflow: hidden;
      display: flex;
    }
    .sidebar {
      width: 250px;
      background: rgba(0,0,0,0.13);
      padding: 2rem 1rem;
      border-right: 2px solid #23243e;
      min-height: 600px;
    }
    .sidebar h2 { font-size: 1.3rem; }
    .profile-stat { margin: 1rem 0 0.8rem; }
    .quest-map-container {
      flex: 1;
      padding: 2rem 2.5rem;
    }
    .quest-map {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      justify-content: center;
    }
    .quest-node {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #23243e;
      border: 3px solid #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s, opacity 0.3s;
      opacity: 1;
      position: relative;
    }
    .quest-node.locked {
      background: #444466;
      border: 3px dashed #666666;
      color: #bbb;
      cursor: not-allowed;
      opacity: 0.6;
    }
    .quest-node.completed {
      background: #23c483;
      border-color: #23c483;
      color: #fff;
    }
    .quest-node .node-num {
      font-weight: bold;
      font-size: 1.2rem;
    }
    .quest-node .node-icon {
      font-size: 1.3rem;
    }
    #activityFrame {
      width: 100%;
      min-height: 400px;
      border: none;
      box-shadow: 0 0 10px #23243e;
      margin-bottom: 1rem;
      background: #101024;
      border-radius: 12px;
      display: none;
    }
    #completionPopup {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(20,22,44,0.86);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      display: none;
    }
    #completionPopup .popup-content {
      background: #23243e;
      color: #fff;
      padding: 2rem 3rem;
      border-radius: 16px;
      box-shadow: 0 0 22px #1f1f2e;
      text-align: center;
    }
    #completionPopup button {
      margin-top: 1.5rem;
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      background: #23c483;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .landing {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at bottom, #0b0c1b 0%, #000000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20000;
      flex-direction: column;
      color: #fff;
      transition: opacity 0.5s;
    }
    .landing h1 { font-size: 2.2rem; margin-bottom: 1rem; }
    .landing input { padding: 0.6rem; border-radius: 7px; border: none; font-size: 1rem; }
    .landing button { margin-left: 1rem; padding: 0.6rem 2rem; border-radius: 7px; border: none; background: #23c483; color: #fff; font-size: 1.1rem; cursor: pointer; }
    .landing.hide { opacity: 0; pointer-events: none; }
    .activity-instructions {
      margin-bottom: 1rem;
      font-size: 1.1rem;
      color: #ffd700;
      text-align: center;
      background: rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 0.7rem 1rem;
    }
  </style>
</head>
<body>
  <div class="landing" id="landingPage">
    <h1>Welcome to Grammar Quest! 🌟</h1>
    <p>Embark on an adventure to master English grammar.</p>
    <input type="text" id="playerName" placeholder="Enter your name..." />
    <button onclick="startQuestJourney()">Start Quest</button>
  </div>
  <div class="main-container" style="display:none;">
    <div class="sidebar">
      <h2>Profile</h2>
      <div class="profile-stat">👤 Name: <span id="profileName"></span></div>
      <div class="profile-stat">🏅 Badges: <span id="profileBadges">—</span></div>
      <div class="profile-stat">🔥 Streak: <span id="profileStreak">0</span></div>
      <div class="profile-stat">✅ Completed: <span id="completedCount">0</span>/12</div>
    </div>
    <div class="quest-map-container">
      <h2>Quest Map</h2>
      <div class="quest-map" id="questMap"></div>
      <div class="activity-instructions" id="activityInstructions" style="display:none;"></div>
      <iframe id="activityFrame"></iframe>
    </div>
  </div>
  <div id="completionPopup">
    <div class="popup-content">
      <h2>🎉 Quest Complete!</h2>
      <div id="questStats"></div>
      <button onclick="proceedToNextQuest()">Proceed to Next Quest</button>
    </div>
  </div>
  <script>
    // List all activities here
    const activities = [
      { title: "Wh-Questions", file: "Wh1.html", instructions: "Choose the correct Wh-question for each sentence." },
      { title: "Wh-Questions II", file: "Wh2.html", instructions: "Continue mastering Wh-Questions." },
      // Add more activities as you have them:
      { title: "Activity 3", file: "Wh3.html", instructions: "Instructions for Activity 3." },
      { title: "Activity 4", file: "Wh4.html", instructions: "Instructions for Activity 4." },
      { title: "Activity 5", file: "Wh5.html", instructions: "Instructions for Activity 5." },
      { title: "Activity 6", file: "Wh6.html", instructions: "Instructions for Activity 6." },
      { title: "Activity 7", file: "Wh7.html", instructions: "Instructions for Activity 7." },
      { title: "Activity 8", file: "Wh8.html", instructions: "Instructions for Activity 8." },
      { title: "Activity 9", file: "Wh9.html", instructions: "Instructions for Activity 9." },
      { title: "Activity 10", file: "Wh10.html", instructions: "Instructions for Activity 10." },
      { title: "Activity 11", file: "Wh11.html", instructions: "Instructions for Activity 11." },
      { title: "Activity 12", file: "Wh12.html", instructions: "Instructions for Activity 12." }
    ];
    // Progress tracking
    let userProgress = {
      unlocked: [true], // First quest unlocked
      completed: [],
      streak: 0,
      badges: [],
      name: ""
    };
    for (let i = 1; i < activities.length; i++) userProgress.unlocked[i] = false;

    // Load/save progress (localStorage for demo)
    function loadProgress() {
      const p = localStorage.getItem("grammarQuestProgress");
      if (p) userProgress = JSON.parse(p);
    }
    function saveProgress() {
      localStorage.setItem("grammarQuestProgress", JSON.stringify(userProgress));
    }

    // Landing page logic
    function startQuestJourney() {
      const name = document.getElementById("playerName").value.trim();
      if (!name) return alert("Please enter your name!");
      userProgress.name = name;
      saveProgress();
      document.getElementById("profileName").textContent = name;
      document.getElementById("landingPage").classList.add("hide");
      setTimeout(() => {
        document.getElementById("landingPage").style.display = "none";
        document.querySelector(".main-container").style.display = "";
        renderQuestMap();
        updateProfile();
      }, 500);
    }

    // Quest map rendering
    function renderQuestMap() {
      const map = document.getElementById("questMap");
      map.innerHTML = "";
      activities.forEach((act, idx) => {
        const node = document.createElement("div");
        node.className = "quest-node";
        node.innerHTML = `<span class="node-num">${idx+1}</span>`;
        if (userProgress.completed[idx]) {
          node.classList.add("completed");
          node.innerHTML += `<span class="node-icon">✅</span>`;
        } else if (!userProgress.unlocked[idx]) {
          node.classList.add("locked");
          node.innerHTML += `<span class="node-icon">🔒</span>`;
        } else {
          node.innerHTML += `<span class="node-icon">🗝️</span>`;
        }
        node.title = act.title;
        node.onclick = () => {
          if (!userProgress.unlocked[idx]) return;
          loadActivity(idx);
        };
        map.appendChild(node);
      });
      document.getElementById("completedCount").textContent = userProgress.completed.filter(Boolean).length;
    }

    // Load activity in iframe
    function loadActivity(idx) {
      // If already completed, allow replay but don't unlock further
      document.getElementById("activityInstructions").style.display = "";
      document.getElementById("activityInstructions").textContent = activities[idx].instructions;
      const frame = document.getElementById("activityFrame");
      frame.src = activities[idx].file;
      frame.style.display = "";
      // Listen for completion messages:
      window.onmessage = function(event) {
        if (event.data && event.data.type === "questComplete") {
          // Called from child iframe (activity file)
          handleQuestCompletion(idx, event.data.stats);
        }
      };
    }

    // Completion popup handling
    function handleQuestCompletion(idx, stats) {
      userProgress.completed[idx] = true;
      userProgress.streak += 1;
      userProgress.unlocked[idx+1] = true; // unlock next
      // Badge logic (demo)
      if (userProgress.streak === 3) userProgress.badges.push("3 Streak! 🥇");
      saveProgress();
      updateProfile();
      renderQuestMap();
      // Show completion popup
      document.getElementById("completionPopup").style.display = "flex";
      document.getElementById("questStats").innerHTML =
        `<p>You completed: <b>${activities[idx].title}</b></p>
        <p>Your Score: ${stats.score || "—"}</p>
        <p>Time Taken: ${stats.time || "—"} seconds</p>
        <p>Streak: ${userProgress.streak}</p>
        ${userProgress.badges.length ? `<p>Badges: ${userProgress.badges.join(", ")}</p>` : ""}`;
      // Hide activity
      document.getElementById("activityFrame").style.display = "none";
      document.getElementById("activityInstructions").style.display = "none";
    }
    function proceedToNextQuest() {
      document.getElementById("completionPopup").style.display = "none";
      renderQuestMap();
      updateProfile();
    }

    // Profile update
    function updateProfile() {
      document.getElementById("profileName").textContent = userProgress.name || "—";
      document.getElementById("profileBadges").textContent = userProgress.badges.join(", ") || "—";
      document.getElementById("profileStreak").textContent = userProgress.streak;
      document.getElementById("completedCount").textContent = userProgress.completed.filter(Boolean).length;
    }

    // Load on start
    loadProgress();
    if (userProgress.name) {
      document.getElementById("profileName").textContent = userProgress.name;
      document.getElementById("landingPage").style.display = "none";
      document.querySelector(".main-container").style.display = "";
      renderQuestMap();
      updateProfile();
    }

    // For demo: define questComplete messaging in your activity files:
    // window.parent.postMessage({type: "questComplete", stats: {score: 9, time: 45}}, "*");
    // Place this in your activity HTML's showScore() or completion logic.

  </script>
</body>
</html>
