<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tap-to-Match Quiz 🌌</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>


<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(ellipse at center, #f4ecd8 0%, #e8d9b5 100%);
    color: #3b2f1e;
    text-align: center;
  }

  .container {
    position: relative;
    max-width: 900px;
    margin: 2rem auto;
    background: rgba(255, 255, 240, 0.85);
    padding: 2rem;
    border-radius: 15px;
    border: 1px solid #d2b48c;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
  }

  .question {
    font-size: 1.6rem;
    margin-bottom: 1rem;
    color: #4a3b2a;
  }

  .drag-options {
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem;
    margin-bottom: 2rem;
    justify-content: center;
  }

  .drag-item {
    padding: 0.6rem 1.2rem;
    background: #f7e7c4;
    border: 1px solid #d2b48c;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    color: #3b2f1e;
    transition: all 0.2s ease-in-out;
  }

  .drag-item:hover {
    background: #f5deb3;
    transform: scale(1.05);
  }

  .drag-item.selected {
    border: 2px solid #8b7355;
    background: #f0dba5;
  }

  .drop-container {
    display: inline;
    text-align: left;
    line-height: 2;
  }

  .drop-zone {
    display: inline;
    border: none;
    padding: 0;
    margin: 0 0.2rem;
    cursor: pointer;
    background: none;
    color: #5b442a;
    font-size: 1.4rem;
  }

  .drop-zone.filled {
  background-color: transparent;
  border: none;
  color: #228b22;
}

  .correct {
    color: #228b22 !important; /* soft natural green */
    font-weight: bold;
  }

  .wrong {
    color: #b22222 !important; /* muted brick red */
    font-weight: bold;
  }

  @keyframes sparkle {
    0% {
      transform: translate(0, 0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(var(--random-x, 0), -100px) scale(1.5);
      opacity: 0;
    }
  }

  @keyframes gemPulse {
    0%, 100% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.3);
    }
  }

  .gem-spark {
    position: absolute;
    pointer-events: none;
    font-size: 1.5rem;
    animation: sparkle 1s ease-out forwards;
  }

  .gem-counter-pulse {
    animation: gemPulse 0.4s ease-in-out;
  }

  #scoreCard {
    margin-top: 2rem;
    font-size: 1.2rem;
    color: #4b3b2a;
  }

  #timer, #gemsCounter, #progressTracker {
    font-size: 1rem;
    margin-bottom: 1rem;
    color: #6b4f33;
  }

  #restartBtn {
    margin-top: 2rem;
    padding: 0.7rem 2rem;
    font-size: 1.1rem;
    background-color: #d2b48c;
    border: 1px solid #a1886f;
    border-radius: 10px;
    cursor: pointer;
    color: #3b2f1e;
    transition: background-color 0.2s ease;
  }

  #restartBtn:hover {
    background-color: #c9a96b;
  }

  #nameForm {
    margin-bottom: 1.5rem;
  }

  #nameInput {
    padding: 0.5rem;
    font-size: 1rem;
    border-radius: 5px;
    border: 1px solid #c2a677;
    margin-right: 0.5rem;
    background: #fffdf6;
    color: #3b2f1e;
  }

  .quiz-header {
    position: absolute;
    top: 10px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 1rem;
    font-size: 1rem;
    color: #5b442a;
    z-index: 10;
  }

  .quiz-header #timer {
    text-align: left;
    flex: 1;
  }

  .quiz-header #gemsCounter {
    text-align: center;
    flex: 1;
  }

  .quiz-header #progressTracker {
    text-align: right;
    flex: 1;
  }

</style>

</head>
<body>
<div class="container" id="quizContainer">
 <div id="nameForm">
  <input type="text" id="nameInput" placeholder="Enter your name" />
  
  <!-- Department Selector -->
  <select id="departmentSelect" style="display: block; width: 90%; max-width: 300px; margin: 0.5rem auto; padding: 0.7rem; font-size: 1rem; border-radius: 5px; border: none;">
    <option value="">-- Select Department --</option>
    <option value="Cyber Security">Cyber Security</option>
    <option value="CSE-1">CSE-1</option>
    <option value="CSE-2">CSE-2</option>
    <option value="CSE-3">CSE-3</option>
    <option value="Mechanical Engineering">Mechanical Engineering</option>
    <option value="ECE-1">ECE-1</option>
    <option value="ECE-2">ECE-2</option>
    <option value="ECE-3">ECE-3</option>
    <option value="AI DS-1">AI DS-1</option>
    <option value="AI DS-2">AI DS-2</option>
    <option value="Civil">Civil</option>
    <option value="Agri">Agri</option>
    <option value="EEE">EEE</option>
    <option value="EIE">EIE</option>
    <option value="Medical Electronics">Medical Electronics</option>
    <option value="IT-1">IT-1</option>
    <option value="IT-2">IT-2</option>
  </select>

  <button onclick="beginQuiz()">Start Quiz</button>
</div>


  <div id="quizContent" style="display:none;">
   <div class="quiz-header">
  <div id="timer">⏳ 0s</div>
  <div id="gemsCounter">💎 0</div>
  <div id="progressTracker">📍 1 of 1</div>
</div>
    <div class="question" id="question"></div>
    <div class="drag-options" id="dragOptions"></div>
    <div class="drop-container" id="dropContainer"></div>
    <div id="scoreCard"></div>
    <button id="restartBtn" style="display: none;">Restart</button>
  </div>
</div>

<script>
const quizData = [
  {
  "questionItems": [
    { "word": "The Lion King ___ an animated film", "answer": "is" },
    { "word": "released in 1994. It ___ directed by Roger Allers and Rob Minkoff", "answer": "was" },
    { "word": "and ___ by Walt Disney Pictures.", "answer": "produced" },
    { "word": "The movie ___ beautiful songs written by Elton John and Tim Rice.", "answer": "has" }
  ],
  "answers": ["is", "was", "produced", "has"]
},
{
  "questionItems": [
    { "word": "The story ___ around a young lion named Simba", "answer": "revolves" },
    { "word": "who ___ to become the king of the Pride Lands.", "answer": "struggles" },
    { "word": "He ___ from his home after a tragedy and feels lost.", "answer": "runs" },
    { "word": "Later, he ___ his courage and returns to face his past.", "answer": "finds" }
  ],
  "answers": ["revolves", "struggles", "runs", "finds"]
}


];

let current = 0;
let wrongQuestions = [];
let correctCount = 0;
let totalWrongGuesses = 0;
let gemsCount = 0;
let startTime;
let timerInterval;
let playerName = "";
let playerDept = "";
let selectedOption = null;

const questionEl = document.getElementById("question");
const dragOptionsEl = document.getElementById("dragOptions");
const dropContainerEl = document.getElementById("dropContainer");
const timerEl = document.getElementById("timer");
const gemsCounterEl = document.getElementById("gemsCounter");
const progressTracker = document.getElementById("progressTracker");
const scoreCard = document.getElementById("scoreCard");
const restartBtn = document.getElementById("restartBtn");

function beginQuiz() {
  const nameField = document.getElementById("nameInput");
  const deptField = document.getElementById("departmentSelect");

  if (!nameField.value.trim()) { alert("Please enter your name!"); return; }
  if (!deptField.value) { alert("Please select your department!"); return; }

  playerName = nameField.value.trim();
  playerDept = deptField.value;

  document.getElementById("nameForm").style.display = "none";
  document.getElementById("quizContent").style.display = "block";
  startQuiz();
  updateProgress();

}

function startQuiz() {
  current = 0;
  correctCount = 0;
  totalWrongGuesses = 0;
  gemsCount = 0;
  startTime = Date.now();
  timerEl.innerText = "⏳ 0s";
  gemsCounterEl.innerText = `💎 0`;
  scoreCard.innerHTML = "";
  restartBtn.style.display = "none";
  loadQuestion();
  startTimer();
}

function updateProgress() {
  // Show total pending questions = remaining in quizData plus queued wrongQuestions
  const totalPending = quizData.length + wrongQuestions.length;
  // current is 0-based; shown index should be min(current+1, totalPending)
  const shownIndex = Math.min(current + 1, totalPending === 0 ? 0 : totalPending);
  // If quiz hasn't started, show 0 of totalPending
  const displayIndex = (quizData.length === 0 && wrongQuestions.length === 0) ? 0 : current + 1;
  progressTracker.innerText = `📍 ${displayIndex} of ${totalPending}`;
}


function loadQuestion() {
  if (current >= quizData.length) return showScore();
  selectedOption = null;
  const data = quizData[current];
  updateProgress();

  dragOptionsEl.innerHTML = "";
  dropContainerEl.innerHTML = "";

  const shuffledAnswers = [...data.answers].sort(() => Math.random() - 0.5);

  shuffledAnswers.forEach((ans) => {
    const div = document.createElement("div");
    div.classList.add("drag-item");
    div.innerText = ans;
    div.onclick = () => selectOption(div);
    dragOptionsEl.appendChild(div);
  });

  data.questionItems.forEach((item) => {
    const drop = document.createElement("div");
    drop.classList.add("drop-zone");
    drop.innerText = item.word;
    drop.dataset.answer = item.answer;
    drop.onclick = () => placeOption(drop);
    dropContainerEl.appendChild(drop);
dropContainerEl.appendChild(document.createTextNode(" "));
  });
}

function selectOption(div) {
  if (div.style.display === "none") return;
  if (selectedOption) selectedOption.classList.remove("selected");
  selectedOption = div;
  div.classList.add("selected");
}

function placeOption(dropZone) {
  if (!selectedOption) return;

  const answer = selectedOption.innerText;
  const correctAnswer = dropZone.dataset.answer;
  const currentText = dropZone.innerText;

  if (correctAnswer === answer) {
    correctCount++;
    gemsCount++;
    
    // Create sparkle effect
    createSparkleEffect(dropZone);
    
    // Pulse the gem counter
    gemsCounterEl.classList.add('gem-counter-pulse');
    setTimeout(() => gemsCounterEl.classList.remove('gem-counter-pulse'), 400);
    
    gemsCounterEl.innerText = `💎 ${gemsCount}`;

    // Replace blank with correct answer visually
    if (currentText.includes("___")) {
      dropZone.innerHTML = currentText.replace("___", `<strong style="color:#00ff88;">${answer}</strong>`);
    } else {
      dropZone.innerHTML = `${currentText} <strong style="color:#00ff88;">${answer}</strong>`;
    }

    dropZone.classList.add("correct", "filled");
    selectedOption.style.display = "none";
  } else {
    totalWrongGuesses++;
    gemsCount--;
    gemsCounterEl.innerText = `💎 ${gemsCount}`;
    dropZone.classList.add("wrong");
    setTimeout(() => dropZone.classList.remove("wrong"), 600);

    // Add the entire current question back to wrongQuestions if not already added
    const currentData = quizData[current];
  if (!wrongQuestions.includes(currentData)) {
  wrongQuestions.push(currentData);
  // Immediately reflect the queued question in the counter
  updateProgress();
}
  }

  selectedOption.classList.remove("selected");
  selectedOption = null;

  // Check if all blanks for current question are filled
  const remaining = document.querySelectorAll(".drop-zone:not(.filled)").length;
if (remaining === 0) {
  setTimeout(() => {
    current++;

   if (current >= quizData.length) {
  if (wrongQuestions.length > 0) {
    quizData.push(...wrongQuestions);
    wrongQuestions = [];

    // ✅ Defer counter update to next frame so total updates correctly
    requestAnimationFrame(updateProgress);
  }
}

    // ✅ Also refresh counter on next question load
    loadQuestion();
  }, 800);
}
}

function createSparkleEffect(element) {
  const rect = element.getBoundingClientRect();
  const container = document.getElementById('dropContainer');
  
  // Create multiple sparks
  const sparkCount = 8;
  for (let i = 0; i < sparkCount; i++) {
    const spark = document.createElement('div');
    spark.className = 'gem-spark';
    spark.innerText = ['💎', '✨', '⭐'][Math.floor(Math.random() * 3)];
    
    // Position relative to the drop zone
    spark.style.position = 'absolute';
    spark.style.left = `${rect.left - container.getBoundingClientRect().left + rect.width / 2}px`;
    spark.style.top = `${rect.top - container.getBoundingClientRect().top + rect.height / 2}px`;
    
    // Random horizontal spread
    const randomX = (Math.random() - 0.5) * 100;
    spark.style.setProperty('--random-x', `${randomX}px`);
    
    container.appendChild(spark);
    
    // Remove after animation
    setTimeout(() => spark.remove(), 1000);
  }
}

function showScore() {
  // If there are still wrong questions pending, replay them first
  if (wrongQuestions.length > 0) {
    quizData.push(...wrongQuestions);
    wrongQuestions = [];
    current = quizData.length - wrongQuestions.length - 1; // ensure next question loads properly
    return loadQuestion(); // stop here and resume quiz
  }

  clearInterval(timerInterval);
  const totalTime = Math.floor((Date.now() - startTime) / 1000);

  questionEl.innerText = "🎉 Quiz Completed!";
  dragOptionsEl.innerHTML = "";
  dropContainerEl.innerHTML = "";
  progressTracker.innerText = "";
  scoreCard.innerHTML = `
    <p>👤 Player: ${playerName}</p>
     <button onclick="downloadPDFReport()" style="margin-top: 1rem; padding: 0.7rem 2rem; background-color: #4CAF50; border: none; border-radius: 10px; cursor: pointer; color: white; font-size: 1rem;">📥 Download PDF Report</button>
  <p>✅ All Questions: Answered Correctly on First Attempt!</p> 
    <p>✅ Correct Answers: ${correctCount}</p>
    <p>❌ Wrong Attempts: ${totalWrongGuesses}</p>
    <p>💎 Final Gems: ${gemsCount}</p>
    <p>⏱️ Time Taken: ${totalTime} seconds</p>
  `;
  restartBtn.style.display = "inline-block";
  progressTracker.innerText = "";


  // --- SEND RESULTS TO GOOGLE SHEET ---
  fetch("https://script.google.com/macros/s/AKfycbxA0lRkERWFt2cYfmm04IQioaG4-21k5VFF5CFKP30zyVaJXM5_27PL3v8JIZEweK3u/exec", {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: playerName,
      correct: correctCount,
      wrong: totalWrongGuesses,
      time: totalTime,
      department: playerDept,
      questId: "Quest 20"
    })
  });
}


function startTimer() {
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime)/1000);
    timerEl.innerText = `⏳ ${elapsed}s`;
  }, 1000);
}

function downloadPDFReport() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const totalTime = Math.floor((Date.now() - startTime) / 1000);
  const reportDate = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });

  // --- HEADER ---
  doc.setFillColor(25, 25, 60);
  doc.rect(0, 0, 210, 45, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont('times', 'bold');
  doc.setFontSize(18);
  doc.text('SRM VALLIAMMAI ENGINEERING COLLEGE', 105, 16, { align: 'center' });
  doc.setFontSize(12);
  doc.setFont('times', 'italic');
  doc.text('(Autonomous)', 105, 23, { align: 'center' });
  doc.setFontSize(15);
  doc.setFont('times', 'normal');
  doc.text('Department of English', 105, 31, { align: 'center' });
  doc.setFontSize(14);
  doc.setFont('times', 'bold');
  doc.setTextColor(212, 175, 55);
  doc.text('Quest Performance Report', 105, 39, { align: 'center' });

  // --- STUDENT INFO ---
  doc.setTextColor(0, 0, 0);
  doc.setFontSize(11);
  doc.text('CANDIDATE INFORMATION', 20, 55);
  doc.autoTable({
    startY: 58,
    body: [
      ['Student Name', playerName],
      ['Department', playerDept],
      ['Quest ID', 'Quest 20'],
      ['Completed On', reportDate]
    ],
    theme: 'plain',
    styles: { fontSize: 10, font: 'times', cellPadding: 3 },
    columnStyles: {
      0: { fontStyle: 'bold', cellWidth: 60, textColor: [70, 70, 70] },
      1: { cellWidth: 120 }
    },
    margin: { left: 20, right: 20 }
  });

  // --- PERFORMANCE SUMMARY ---
  let y = doc.lastAutoTable.finalY + 10;
  doc.setFont('times', 'bold');
  doc.text('PERFORMANCE SUMMARY', 20, y);
  y += 4;
  doc.autoTable({
    startY: y + 3,
    body: [
      ['Total Questions', quizData.length.toString()],
      ['Correct Answers', correctCount.toString()],
      ['Wrong Attempts', totalWrongGuesses.toString()],
      ['Final Gems Earned', gemsCount.toString()],
      ['Total Time', `${Math.floor(totalTime / 60)}m ${totalTime % 60}s`]
    ],
    theme: 'grid',
    styles: { fontSize: 10, font: 'times', cellPadding: 3 },
    margin: { left: 20, right: 20 }
  });

  // --- QUESTION BANK SECTION ---
  y = doc.lastAutoTable.finalY + 12;
  if (y > 250) { doc.addPage(); y = 20; }
  doc.setFont('times', 'bold');
  doc.text('QUESTION BANK WITH CORRECT ANSWERS', 20, y);
  y += 6;

  quizData.forEach((item, i) => {
    if (y > 260) { doc.addPage(); y = 20; }
    doc.setFontSize(11);
    doc.setFont('times', 'bold');
    doc.setTextColor(25, 25, 60);
    doc.text(`Question ${i + 1}:`, 20, y);
    y += 6;
    doc.setTextColor(0, 0, 0);
    doc.setFont('times', 'normal');
    item.questionItems.forEach((qItem, j) => {
      const questionText = `${j + 1}. ${qItem.word.replace('___', '____')} `;
      const answerText = `Answer: ${qItem.answer}`;
      const lines = doc.splitTextToSize(questionText, 160);
      doc.text(lines, 25, y);
      y += lines.length * 5;
      doc.setTextColor(0, 128, 0);
      doc.text(answerText, 30, y);
      doc.setTextColor(0, 0, 0);
      y += 7;
    });
    y += 3;
    doc.setDrawColor(230, 230, 230);
    doc.setLineWidth(0.3);
    doc.line(20, y, 190, y);
    y += 5;
  });

  // --- FOOTER ---
  doc.setDrawColor(184, 134, 11);
  doc.setLineWidth(0.5);
  doc.line(20, 280, 190, 280);
  doc.setFontSize(8);
  doc.setTextColor(128, 128, 128);
  doc.setFont('times', 'italic');
  doc.text('This is a system-generated report', 105, 287, { align: 'center' });

  const cleanName = playerName.replace(/[^a-zA-Z0-9]/g, '_');
  doc.save(`${cleanName}_Quest20_Report.pdf`);
}

restartBtn.onclick = () => {
  document.getElementById("quizContent").style.display = "none";
  document.getElementById("nameForm").style.display = "block";
  document.getElementById("nameInput").value = "";
};
</script>
</body>
</html>
